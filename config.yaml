kimhannom_api:
  base_url: "https://kimhannom.fit.hcmus.edu.vn"
  # Giới hạn số lượt gọi trên website: 25/phút, 50/giờ, 200/ngày, 600/tuần
  rate_limits:
    per_minute: 25
    per_hour: 50
    per_day: 200
    per_week: 600
    min_delay_seconds: 3.0
  default_params:
    ocr_id: 1            # 1: Thông thường, chiều dọc | 2: Hành chính | 3: Ngoại cảnh | 4: Thông thường, chiều ngang
    lang_type: 2         # 0: Chưa biết | 1: Chữ Hán | 2: Chữ Nôm
    reading_direction: 1 # 1: Dọc (mặc định) | 2: Ngang
    epitaph: 0           # 0: Văn bản thông thường | 1: Văn bia
    tag: null

